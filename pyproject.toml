[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project]
authors = [{ name = "Yury Gorishniy" }]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The minimum required PyTorch version is the minimum version where the code works
    # on the MPS device with the `PYTORCH_ENABLE_MPS_FALLBACK=1` environment variable.
    "torch>=2.7.1,<3",
]
description = "TabPack: efficient parallel training and ensembling of MLPs for tabular deep learning."
keywords = [
    "artificial intelligence",
    "classification",
    "deep learning",
    "library",
    "machine learning",
    "python",
    "pytorch",
    "regression",
    "research",
    "torch",
    "tabular",
    "tabular data",
]
license = { file = "LICENSE" }
name = "tabpackage"
readme = "README.md"
requires-python = ">=3.11,<4"
version = "0.0.1"

[project.optional-dependencies]
sklearn = [
    "numpy>=1.24.2,<3",
    "scikit-learn>=1.2.2,<2",
]

[project.urls]
Code = "https://github.com/yandex-research/tabpack"
Documentation = "https://github.com/yandex-research/tabpack/tree/main/README.md"

[dependency-groups]
dev = [
    "ipython>=8.39.0,<9",
    "jupyterlab>=4.6.3,<5",
    "onnx>=1.17.0",
    "onnxscript>=0.6.1",
    "onnxruntime>=1.23.2",
    "pandas>=1.5.0,<4",
    "polars>=1.0.0,<3",
    "prek>=0.5.3,<0.6",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.8,<1",
    "tqdm>=4.70.1,<5",
    "ty>=0.0.84,<0.1",
    "xdoctest>=1.3.2,<2",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["paper"]
line-length = 88

[tool.ruff.lint]
extend-select = ["RUF", "UP", "E501", "E731"]

[tool.ruff.format]
quote-style = "single"

[tool.uv]
package = true
python-preference = "only-managed"
resolution = "lowest-direct"
